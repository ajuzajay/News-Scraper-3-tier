services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - news-mongo-data:/data/db

  backend:
    image: news-scraper-backend:phase2
    env_file:
      - .env.compose
    depends_on:
      - mongo
    ports:
      - "${BACKEND_PORT}:8000"

  frontend:
    image: news-scraper-frontend:phase2
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:80"

volumes:
  news-mongo-data:
